[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varietywin"
version = "0.1.0"
description = "A Variety-inspired automatic wallpaper changer for Windows"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.12.0",
    "requests>=2.34.2",
    "Pillow>=13.0.0",
    "comtypes>=1.5.0",
    "pywin32>=312",
    "platformdirs>=4.14.5",
    "pydantic>=2.14.3",
    "feedparser>=6.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "requests-mock>=1.12.1",
    "PyInstaller>=6.22.3",
]

[project.scripts]
variety = "varietywin.app:main"

[tool.setuptools.packages.find]
where = ["src"]
